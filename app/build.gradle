apply plugin: 'com.android.application'

android {
    ndkVersion "29.0.14206865"

    compileSdk = 37

    namespace 'com.limelight'

    defaultConfig {
        // 24: required by the Jetpack XR libraries (androidx.xr.*); upstream Moonlight is 21
        minSdk 24
        targetSdk 36

        versionName "20.3.0-fork.23"
        versionCode = 80

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        // AGP 9 no longer generates resValue entries by default
        resValues = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "data:text/html;base64,PGgxPlJvb3QgYnVpbGQgaXMgbm90IGF2YWlsYWJsZTwvaDE+"

            applicationId "com.limelight.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot_game {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/%7B%22id%22%3A%22com.limelight.noir%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2Fjlobue10%2Fmoonlight-android%22%2C%22author%22%3A%22jlobue10%22%2C%22name%22%3A%22Artemis%22%2C%22additionalSettings%22%3A%22%7B%5C%22apkFilterRegEx%5C%22%3A%5C%22nonRoot%5C%22%2C%5C%22matchGroutToUse%5C%22%3A%5C%22%241%5C%22%2C%5C%22versionExtractionRegEx%5C%22%3A%5C%22v(.%2B)%5C%22%7D%22%7D"

            applicationId "com.limelight"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        resources {
            pickFirsts.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".noirdebug"
            resValue "string", "app_label", "Diana"
            resValue "string", "app_label_root", "Diana (Root)"
            resValue "string", "app_label_game", "Diana (Game)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: Leave the following line alone!
            applicationIdSuffix ".noir"
            resValue "string", "app_label", "Artemis"
            resValue "string", "app_label_root", "Artemis (Root)"
            resValue "string", "app_label_game", "Artemis (Game)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


// PyroWave codec library: built with CMake from the vendored source
// (src/main/jni/pyrowave-renderer/pyrowave, the host's exact revision) for the
// 64-bit ABIs before ndk-build runs; pyrowave-renderer/Android.mk picks it up
// as a prebuilt. Only cmake (system or SDK) and the NDK are needed.
def pyroWaveDir = file("src/main/jni/pyrowave-renderer")
def pyroWaveAbis = ["arm64-v8a", "x86_64"]
def findCMake = {
    def onPath = System.getenv("PATH")?.split(File.pathSeparator)
            ?.collect { new File(it, "cmake") }?.find { it.canExecute() }
    if (onPath != null) return onPath.absolutePath
    def sdkDir = android.sdkComponents.sdkDirectory.get().asFile
    def sdkCMake = new File(sdkDir, "cmake").listFiles()
            ?.collect { new File(it, "bin/cmake") }?.find { it.canExecute() }
    if (sdkCMake != null) return sdkCMake.absolutePath
    throw new GradleException("cmake not found: install cmake or the SDK 'cmake' package")
}
def findNdk = {
    def candidates = []
    try { candidates << android.sdkComponents.ndkDirectory.get().asFile } catch (Exception ignored) { }
    def env = System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_ROOT")
    if (env) candidates << new File(env)
    try {
        def sdkDir = android.sdkComponents.sdkDirectory.get().asFile
        candidates << new File(sdkDir, "ndk/${android.ndkVersion}")
    } catch (Exception ignored) { }
    def found = candidates.find { new File(it, "build/cmake/android.toolchain.cmake").isFile() }
    if (found == null) throw new GradleException("NDK with build/cmake/android.toolchain.cmake not found (tried ${candidates})")
    return found
}
def runCommand = { List<String> command, File workDir ->
    def process = new ProcessBuilder(command).directory(workDir).inheritIO().start()
    def code = process.waitFor()
    if (code != 0) throw new GradleException("Command failed (${code}): ${command.join(' ')}")
}
tasks.register("buildPyroWave") {
    description = "Builds libpyrowave-shared.so from the vendored PyroWave source"
    inputs.dir(new File(pyroWaveDir, "pyrowave"))
    inputs.file(new File(pyroWaveDir, "CMakeLists.txt"))
    pyroWaveAbis.each { abi -> outputs.file(new File(pyroWaveDir, "prebuilt/${abi}/libpyrowave-shared.so")) }
    doLast {
        def cmake = findCMake()
        def toolchain = new File(findNdk(), "build/cmake/android.toolchain.cmake")
        pyroWaveAbis.each { abi ->
            def buildDir = layout.buildDirectory.dir("pyrowave/${abi}").get().asFile
            buildDir.mkdirs()
            runCommand([cmake, "-S", pyroWaveDir.absolutePath, "-B", buildDir.absolutePath,
                        "-DCMAKE_TOOLCHAIN_FILE=${toolchain.absolutePath}".toString(),
                        "-DANDROID_ABI=${abi}".toString(), "-DANDROID_PLATFORM=android-26",
                        "-DANDROID_STL=c++_static", "-DCMAKE_BUILD_TYPE=Release"], buildDir)
            runCommand([cmake, "--build", buildDir.absolutePath, "--target", "pyrowave-shared",
                        "--parallel", "${Runtime.runtime.availableProcessors()}".toString()], buildDir)
            def built = new File(buildDir, "libpyrowave-shared.so")
            if (!built.isFile()) throw new GradleException("PyroWave build produced no library for ${abi}")
            def out = new File(pyroWaveDir, "prebuilt/${abi}/libpyrowave-shared.so")
            out.parentFile.mkdirs()
            out.bytes = built.bytes
        }
    }
}
tasks.configureEach { t ->
    if (t.name.startsWith("configureNdkBuild") || t.name.startsWith("buildNdkBuild") ||
            t.name.startsWith("externalNativeBuild") || t.name == "preBuild") {
        t.dependsOn("buildPyroWave")
    }
}

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.github.ByteHamster:SearchPreference:v2.5.1'
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.0'
    implementation 'org.opencv:opencv:4.12.0'

    // Android XR: stereoscopic presentation of the SBS 3D output in Full Space (docs/XR_STEREO.md).
    // Only loaded at runtime on devices that declare android.software.xr.api.spatial.
    implementation 'androidx.xr.scenecore:scenecore:1.0.0-rc01'
    implementation 'androidx.xr.runtime:runtime:1.0.0-rc01'
    // Head pose (RenderViewpoint) for "Recenter stereo screen"; scenecore already pulls it in
    // transitively, the explicit entry only makes it visible at compile time.
    implementation 'androidx.xr.arcore:arcore:1.0.0-rc01'
    // Compile-time stubs of the device-side com.android.extensions.xr library. REQUIRED with R8:
    // without them R8 desugars the Jetpack XR callbacks that implement platform interfaces without
    // their bridge methods and the process dies with AbstractMethodError
    // ("com.android.extensions.xr.function.Consumer.accept") as soon as the XR runtime calls back.
    // compileOnly on purpose: the real library comes from the device (uses-library in the manifest).
    compileOnly 'com.android.extensions.xr:extensions-xr:1.4.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.mockito:mockito-core:5.19.0'
}
