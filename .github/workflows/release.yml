name: Build and release APKs

# Builds the nonRoot_game release APKs (one per ABI), signs them, and:
#   - on a `v*` tag push: publishes them as a GitHub release (Obtainium reads these);
#   - on manual dispatch: uploads them as workflow artifacts only.
#
# Signing: if the repository has the secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS and KEY_PASSWORD, the APKs are signed with that keystore so later
# releases install as updates. Without them a throwaway key is generated for the
# run, which means every release has a different signature and must be installed
# after uninstalling the previous build; a release (as opposed to a build-only run) is
# refused in that state unless allow_throwaway_key is set. See docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to create and publish a release for (e.g. v20.3.0-fork.1). Leave empty to only build artifacts."
        required: false
        default: ''
        type: string
      allow_throwaway_key:
        description: "Publish the release even though no keystore secrets are configured (throwaway signature: users must uninstall to update)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  BUILD_TOOLS_VERSION: "36.0.0"
  NDK_VERSION: "29.0.14206865"
  # The tag being released: the pushed tag, or the release_tag input of a manual run
  # (which creates the tag at the built commit when the release is published).
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

jobs:
  build:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          COMPILE_SDK=$(sed -nE 's/^\s*compileSdk\s*=?\s*([0-9]+).*/\1/p' app/build.gradle | head -1)
          echo "compileSdk from app/build.gradle: $COMPILE_SDK"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          # Refresh the SDK manager itself so recently published packages are visible to it
          "$SDKMANAGER" --install "cmdline-tools;latest" >/dev/null 2>&1 || echo "::warning::cmdline-tools update failed; using the preinstalled SDK manager"
          echo "== SDK packages of interest available in the repository =="
          "$SDKMANAGER" --list 2>/dev/null | awk '{print $1}' | grep -E '^(platforms;android-3[5-9]|build-tools;3[5-9]\.|ndk;2[7-9]\.)' | sort -u || true
          "$SDKMANAGER" --install "platforms;android-${COMPILE_SDK}" "build-tools;${BUILD_TOOLS_VERSION}"
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" || echo "::warning::ndk;${NDK_VERSION} is not installable via sdkmanager; the Android Gradle plugin will try to download it"
          "$SDKMANAGER" --list_installed 2>/dev/null | grep -E 'platforms;|build-tools;|ndk;' || true

      - name: Verify the release tag matches the version in app/build.gradle
        if: env.RELEASE_TAG != ''
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -nE 's/^\s*versionName\s+"([^"]+)".*/\1/p' app/build.gradle | head -1)
          TAG="${RELEASE_TAG}"
          echo "versionName=$VERSION_NAME tag=$TAG"
          if [ "v$VERSION_NAME" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $VERSION_NAME in app/build.gradle"
            exit 1
          fi

      - name: Build release APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleNonRoot_gameRelease
          ls -la app/build/outputs/apk/nonRoot_game/release/

      - name: Sign APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALLOW_THROWAWAY_KEY: ${{ inputs.allow_throwaway_key }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          mkdir -p dist
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Signing with the repository keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            SIGNING_NOTE="Signed with the project's release key."
          else
            if [ -n "${RELEASE_TAG:-}" ] && [ "${ALLOW_THROWAWAY_KEY:-false}" != "true" ]; then
              echo "::error::Refusing to publish ${RELEASE_TAG} without the KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD secrets: the APKs would carry a throwaway signature that no later release can update. Run tools/release-signing/setup-signing-secrets.sh (see docs/RELEASING.md), or re-run with allow_throwaway_key enabled."
              exit 1
            fi
            echo "::warning::No KEYSTORE_BASE64 secret: signing with a throwaway key generated for this run. The resulting APKs cannot be installed over a build signed with a different key; uninstall the previous build first."
            KEYSTORE_PASSWORD="throwaway-$RANDOM$RANDOM"
            KEY_ALIAS="throwaway"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 \
              -validity 36500 -dname "CN=throwaway release key, O=moonlight-android fork" >/dev/null 2>&1
            SIGNING_NOTE="Signed with a THROWAWAY key generated for this run (no KEYSTORE_BASE64 secret configured): uninstall any previously installed build before installing, and expect to do the same for the next release."
          fi
          echo "$SIGNING_NOTE" > dist/SIGNING_NOTE.txt
          for unsigned in app/build/outputs/apk/nonRoot_game/release/*-unsigned.apk; do
            name=$(basename "$unsigned" -unsigned.apk)
            "$BT/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/$name-aligned.apk"
            "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
              --out "dist/$name.apk" "$RUNNER_TEMP/$name-aligned.apk"
            "$BT/apksigner" verify --print-certs "dist/$name.apk" | head -3
          done
          rm -f "$KS"
          ls -la dist/
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ env.RELEASE_TAG || github.ref_name }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/SIGNING_NOTE.txt
          if-no-files-found: error

      - name: Write release notes
        if: env.RELEASE_TAG != ''
        run: |
          set -euo pipefail
          {
            echo "Release build of \`${RELEASE_TAG}\` (commit ${GITHUB_SHA})."
            echo
            echo "Install the APK matching your device's CPU architecture (most phones, tablets and headsets: **arm64-v8a**). For Obtainium, add this repository as a GitHub source and pick the arm64-v8a APK."
            echo
            echo "**Signing:** $(cat dist/SIGNING_NOTE.txt)"
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > dist/RELEASE_NOTES.md

      - name: Publish GitHub release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
